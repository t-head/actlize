name: actlize checkin     # ① Workflow 名称（显示在 Actions 页面）

# ② 触发条件
on:
  workflow_dispatch:                                       # 支持手动触发（网页/API）
  pull_request:
    branches: ['v0.5.0', 'v0.8.0', 'v1.0.0']         # 目标分支决定运行哪个 actlize 版本
    types: [opened, synchronize, reopened]
  # push:
  #   branches: ['feature/add-ci-workflow']                                       # 调试时打开

permissions:                    # ③ Token 权限
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-actlize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # 新运行自动取消旧的

jobs:
  
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    uses: t-head/.github/.github/workflows/user-precheck.yml@main
  # TODO: add smoketest if necessary

  # Stage 2: AI 代码审查
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: 人工审批门禁
  human-review:
    name: Human Review Gate
    # TODO: change to ai-code-review
    needs: precheck
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: actlize UT，按分支传入版本、runner 与 caselist
  actlize-ut-tests-ppu:
    name: actlize 0.8.0 UT Tests PPU
    needs: precheck
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'v0.8.0')
    uses: ./.github/workflows/pr-actlize-test-ppu.yaml
    with:
      version: '0.8.0'
      matrix: '[{"runner": "OAM-810E", "caselist": "caselist0.8.0.list"}]'
    secrets: inherit

  flashmla-with-actlize080-tests:
    name: FlashMLA with actlize 0.8.0 Tests
    needs: precheck
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'v0.8.0')
    uses: t-head/FlashMLA-for-sail/.github/workflows/flashmla-ut-test-ppu.yml@main
    with:
      source_mode: 'actlize'
    secrets: inherit

  fa272-with-actlize080:
    name: FA 2.7.2 with actlize 0.8.0 Tests
    needs: precheck
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'v0.8.0')
    uses: t-head/flash-attention-for-sail/.github/workflows/pr-fa272-test-ppu.yaml@v2.8.2
    with:
      source_mode: 'actlize0.8.0'
    secrets: inherit
