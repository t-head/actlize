name: actlize1.0.0 checkin     # Workflow name shown on the Actions page

# Triggers
on:
  pull_request:
    branches: [v1.0.0, feature/add-ci-1.0.0]                                     # PRs targeting v1.0.0
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [v1.0.0, feature/add-ci-1.0.0]                                     # Re-run after merge into v1.0.0
  workflow_dispatch:                                       # Allow manual trigger (web/API)

permissions:                    # Token permissions
  contents: read
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-actlize100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # A new run cancels the old one

env:
  SAIL_IMAGE: reg.docker.alibaba-inc.com/ai-tmp/pytorch:2.10.0-ubuntu24.04-hggcrt3-py312-ppu202609181903

jobs:
  build-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Pair each runner with its dedicated caselist and PPU SDK build arg.
        include:
          - runner: ZW-M890P
            caselist: caselist1.0.0_btv1.5.list
            ppu_type: "10500"
          - runner: OAM-810E
            caselist: caselist1.0.0_btv1.0.list
            ppu_type: "10000"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head diff below resolves both ends.
          fetch-depth: 0
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            # PPU SDK and torch are pre-installed in the docker image
            source /usr/local/PPU_SDK/envsetup.sh
            pip install junit-xml
            # actlize1.0.0 build flags: enable ELF compression and compress fatbin
            export HGGC_ENABLE_COMPRESS=1
            export NVCC_APPEND_FLAGS="-Xfatbin -compress-all"
            echo "START TO BUILD"
            bash ./build.sh ${{ matrix.ppu_type }}
            echo "START TO TEST CASES"
            set +e
            python .github/workflows/scripts/ci_actlize_ut.py \
              --caselist .github/workflows/scripts/${{ matrix.caselist }} \
              --build-dir build
            TEST_EXIT_CODE=$?
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ env.SAIL_IMAGE }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggc_enable_compress": os.environ.get("HGGC_ENABLE_COMPRESS", ""),
                "nvcc_append_flags": os.environ.get("NVCC_APPEND_FLAGS", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            # Copy the JUnit report and runtime information to NAS for the runner.
            # Keep results per runner so the parallel matrix jobs do not collide.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/actlize-ci/1.0.0/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp build/test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

  summary:
    name: Test summary
    needs: build-test          # Wait until every parallel build-test matrix job finishes
    if: always()               # Summarize even when some runner failed
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - uses: actions/checkout@v4
      - name: Print test summary
        shell: bash
        run: |
          # Aggregate the JUnit report from every runner produced by the matrix jobs.
          for runner in ZW-M890P OAM-810E; do
            # Resolve the NAS result base directory, preferring /wl_nas/devops
            # then /mnt/wl_nas/devops, and finally any directory named devops.
            if [[ -d "/wl_nas/devops" ]]; then
              NAS_BASE="/wl_nas/devops"
            elif [[ -d "/mnt/wl_nas/devops" ]]; then
              NAS_BASE="/mnt/wl_nas/devops"
            else
              NAS_BASE=$(find / -type d -name "devops" 2>/dev/null | head -n 1)
            fi
            if [[ -z "$NAS_BASE" ]]; then
              echo "Could not locate a devops directory for runner ${runner}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            NAS_RESULT_DIR="${NAS_BASE}/actlize-ci/1.0.0/${{ github.run_id }}/${{ github.run_attempt }}/${runner}"
            XML_FILE="$NAS_RESULT_DIR/test-results.xml"
            RUN_ID_DIR="${NAS_BASE}/actlize-ci/1.0.0/${{ github.run_id }}"
            echo "## Runner: ${runner}" >> "$GITHUB_STEP_SUMMARY"
            # Verbosely log the resolved locations and list everything under the
            # run-id dir so missing/misplaced JUnit reports are easy to diagnose.
            echo "=================================================="
            echo "[${runner}] NAS_BASE       = ${NAS_BASE}"
            echo "[${runner}] RUN_ID_DIR     = ${RUN_ID_DIR}"
            echo "[${runner}] NAS_RESULT_DIR = ${NAS_RESULT_DIR}"
            echo "[${runner}] XML_FILE       = ${XML_FILE}"
            echo "[${runner}] Listing all files under ${RUN_ID_DIR}:"
            find "$RUN_ID_DIR" 2>/dev/null || echo "  (run-id dir does not exist: ${RUN_ID_DIR})"
            echo "=================================================="
            if [[ ! -f "$XML_FILE" ]]; then
              echo "JUnit report NOT found: $XML_FILE"
              echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "JUnit report FOUND, full path: $XML_FILE"
            python3 .github/workflows/scripts/display-test-summary.py "$XML_FILE"
          done
